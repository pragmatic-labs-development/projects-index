name: Refresh index

on:
  schedule:
    # Weekly. The index is only ever as stale as a week, without being noisy.
    - cron: '0 8 * * 1'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Regenerate ONLY with a token that can see private repos.
      #
      # The default GITHUB_TOKEN is scoped to this repository, so building with
      # it silently drops every private repo — the index went from 17 entries to
      # 9 the first time this ran. Without a PAT we deploy the committed
      # index.html as-is, which is stale but never wrong by omission.
      #
      # To enable weekly refresh: create a fine-grained PAT with read access to
      # the org's repos and add it as the INDEX_TOKEN secret.
      - name: Rebuild from the GitHub API
        if: ${{ secrets.INDEX_TOKEN != '' }}
        run: node build.mjs
        env:
          GH_TOKEN: ${{ secrets.INDEX_TOKEN }}

      # Only commits when something actually changed, so scheduled runs don't
      # create empty commits every week.
      - name: Commit if changed
        if: ${{ secrets.INDEX_TOKEN != '' }}
        run: |
          if ! git diff --quiet index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: refresh project index"
            git push
          else
            echo "No changes."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
