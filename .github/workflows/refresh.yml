name: Refresh index

on:
  schedule:
    # Weekly. The index is only ever as stale as a week, without being noisy.
    - cron: '0 8 * * 1'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild from the GitHub API
        run: node build.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only commits when something actually changed, so scheduled runs don't
      # create empty commits every week.
      - name: Commit if changed
        run: |
          if ! git diff --quiet index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: refresh project index"
            git push
          else
            echo "No changes."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
